[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; Only ever run .php files (the default, stated so it can't be loosened by accident).
security.limit_extensions = .php
listen = 127.0.0.1:9000
; Pass the container's environment (APP_KEY, DB_*, ...) through to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
