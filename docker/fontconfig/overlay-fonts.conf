<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used by OverlayCompositor so rsvg-convert (which ignores @font-face) can
     draw the overlay editor's fonts. The system config is kept; the font
     folder and cache dir are filled in at run time (see rasterizeSvg). -->
<fontconfig>
    <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
    <dir>@FONT_DIR@</dir>
    <!-- The editor's default faces stand in for the generic families, so an
         overlay naming plain sans-serif/serif draws the same everywhere we control. -->
    <alias binding="same"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
    <alias binding="same"><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
    <cachedir>@CACHE_DIR@</cachedir>
</fontconfig>
