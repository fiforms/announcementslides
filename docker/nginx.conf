worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 512M;
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # public/storage -> storage/app/public (created by the entrypoint).
        # User uploads live here, so nothing under it may ever reach PHP.
        #
        # `^~` is essential: without it nginx goes on to check the regex
        # locations after matching this prefix, and the `\.php$` block below
        # would hand /storage/x.php to php-fpm and execute it. With `^~` the
        # regex locations at server level are skipped for this whole subtree;
        # only the nested ones below apply. (add_header in a nested location
        # replaces the parent's, so each repeats what it needs.)
        location ^~ /storage/ {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;

            # Belt and braces: refuse script-like names outright rather than
            # serving their source.
            location ~* \.(php[0-9]?|phtml|pht|phar|inc)$ {
                return 403;
            }

            # Backstop for uploaded SVGs (see "SVG security model" in
            # ARCHITECTURE.md): they are sanitized on upload, but if one is
            # ever opened directly this CSP stops any script from running.
            # It does not affect SVGs shown through <img>.
            location ~* \.svg$ {
                add_header Cache-Control "public, max-age=3600";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:" always;
                try_files $uri =404;
            }

            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # index.php is the app's only PHP entry point. Execute that and nothing
        # else, so no other .php file under public/ can ever run.
        location = /index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ \.php$ { return 404; }

        location ~ /\.(?!well-known) { deny all; }
    }
}
