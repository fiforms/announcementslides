# Overlay: run against a MySQL container instead of SQLite.
#   docker compose -f compose.yaml -f compose.mysql.yaml up -d
#
# The database is only reachable on the compose network. For anything public,
# set DB_PASSWORD in .env rather than relying on the default below.
services:
  app:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-announcementslides}
      DB_USERNAME: ${DB_USERNAME:-announcementslides}
      DB_PASSWORD: ${DB_PASSWORD:-announcementslides}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-announcementslides}
      MYSQL_USER: ${DB_USERNAME:-announcementslides}
      MYSQL_PASSWORD: ${DB_PASSWORD:-announcementslides}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
