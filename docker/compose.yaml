# AnnouncementSlides — Docker Compose stack (web app + MySQL).
# This is the ONLY file you need.
#
#   1. Set APP_URL in the "YOUR SETTINGS" block below.
#   2. docker compose up -d
#   3. Open that address in a browser: a setup wizard creates your administrator
#      account and installs the bundled widgets. That's it.
#
# Upgrade later with:  docker compose pull && docker compose up -d
# See https://github.com/fiforms/announcementslides#docker for details
# (backups, reverse proxy / HTTPS, Google sign-in).
#
# Services:
#   app   web server + queue worker + scheduler (migrations run on start)
#   db    MySQL 8.4 (data in the `db` volume; not published on the host)

name: announcementslides

# ============================== YOUR SETTINGS ===============================
x-settings: &settings
  # The address people type into their browser. Used for links and the Google
  # sign-in redirect. Include http:// or https:// (and the port if it isn't
  # 80/443). If you change the port, change the "8080:80" mapping under `app`.
  APP_URL: http://localhost:8080

  # --- First-run setup ------------------------------------------------------
  # While nobody has an account, opening the site goes to a setup wizard that
  # creates the administrator. By default anyone who reaches that page first can
  # do so, which is fine on your own computer. If this server is reachable from
  # the internet before you finish the wizard, require a code (pick any string):
  # SETUP_TOKEN: choose-a-code

  # Show the email/password login form. The wizard's administrator has a
  # password, so this defaults to true. Set to "false" if you use Google
  # sign-in only.
  PASSWORD_LOGIN: "true"

  # --- Optional: uncomment and edit what you need ---------------------------
  # Site name in the header, page titles and emails (default: AnnouncementSlides).
  # APP_NAME: AnnouncementSlides
  # APP_NAME_es: Anuncios                # a different name for one language

  # Behind an HTTPS reverse proxy: its address(es), comma separated, or * if
  # only the proxy can reach this container.
  # TRUSTED_PROXIES: "*"

  # Outbound email (invitations, password resets).
  # MAIL_MAILER: smtp
  # MAIL_HOST: smtp.example.com
  # MAIL_PORT: 587
  # MAIL_USERNAME: me@example.com
  # MAIL_PASSWORD: secret
  # MAIL_FROM_ADDRESS: slides@example.com

  # Google sign-in (create credentials in the Google Cloud Console; the
  # redirect URI is APP_URL + /auth/google/callback).
  # GOOGLE_CLIENT_ID: your-client-id
  # GOOGLE_CLIENT_SECRET: your-client-secret

  # Move large files (videos, big images, PDFs, Slide Announcer updates) to
  # Cloudflare R2, which has no download (egress) fees, and serve them from
  # there. SVGs, thumbnails and small files stay on this server. Leave this
  # off to keep everything here. Setup: INSTALLING.md, "Offloading large
  # files to Cloudflare R2". Existing files: `php artisan media:offload`.
  # MEDIA_OFFLOAD_DISK: r2
  # R2_ACCOUNT_ID: your-cloudflare-account-id
  # R2_ACCESS_KEY_ID: key
  # R2_SECRET_ACCESS_KEY: secret
  # R2_BUCKET: announcementslides-media
  # R2_PUBLIC_URL: https://media.example.org   # the bucket's custom domain
  # MEDIA_OFFLOAD_MIN_BYTES: 1048576           # files smaller than this stay here
  # MEDIA_OFFLOAD_RELEASES: "true"             # also Slide Announcer update files
  # MEDIA_RELEASES_WAIT_FOR_OFFLOAD: "true"    # hold releases back from devices until on R2
  # MEDIA_CACHE_MAX_BYTES: 2147483648          # local cache of files pulled back for exports
  # MEDIA_CACHE_MIN_AGE: 60                    # minutes a cached file is kept after use

  # Backups (Admin > Backups, `php artisan backup:create`). Defaults shown.
  # A database backup is taken daily, and before an update applies migrations.
  # BACKUP_SCHEDULE: daily            # off | daily | weekly (weekly = Sundays)
  # BACKUP_TIME: "02:30"              # UTC
  # BACKUP_KEEP: 14                   # scheduled backups kept
  # BACKUP_KEEP_SAFETY: 3             # pre-update / pre-restore backups kept
  # BACKUP_BEFORE_MIGRATE: "true"
  # BACKUP_DISK: local               # filesystem disk for archives (default: private storage volume)
  # BACKUP_CLIENT_OPTIONS: "--skip-ssl"   # extra mysqldump/mysql arguments, if your DB server needs them

  # Manage the encryption key yourself instead of using the generated one
  # (kept in the storage volume). Generate one with:
  #   docker run --rm ghcr.io/fiforms/announcementslides php artisan key:generate --show
  # APP_KEY: base64:...
# ============================================================================

services:
  app:
    # Pin a release instead of :latest with APP_IMAGE, e.g. ...announcementslides:1.2.0
    image: ${APP_IMAGE:-ghcr.io/fiforms/announcementslides:latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    # Optional extra settings file next to this one; everything in it is passed
    # through. Not required.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *settings
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-announcementslides}
      DB_USERNAME: ${DB_USERNAME:-announcementslides}
      DB_PASSWORD: ${DB_PASSWORD:-announcementslides}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-announcementslides}
      MYSQL_USER: ${DB_USERNAME:-announcementslides}
      # The database is only reachable on the compose network. For anything
      # public, set DB_PASSWORD (in the shell or a .env file next to this one).
      MYSQL_PASSWORD: ${DB_PASSWORD:-announcementslides}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  db:
