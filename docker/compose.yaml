# AnnouncementSlides: app + MySQL. No secrets needed to try it:
#
#   docker compose up -d                       # works with no .env at all
#
# Configuration: copy .env.example to .env (in this directory) and set whatever
# you need. Every variable in it is passed straight into the app container, so
# any Laravel setting (MAIL_*, GOOGLE_*, AWS_*, FILESYSTEM_DISK, ...) can be set
# there without editing this file.
#
# To use an existing MySQL server instead of the bundled one, set DB_HOST (and
# the other DB_* values) in .env and start only the app: docker compose up -d app
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/fiforms/announcementslides:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    environment:
      # Site name shown in the header, page titles and emails (a settings page may
      # replace this later). Per-language names: APP_NAME_es=... in .env.
      APP_NAME: ${APP_NAME:-AnnouncementSlides}
      APP_URL: ${APP_URL:-http://localhost:8080}
      GOOGLE_REDIRECT_URI: ${APP_URL:-http://localhost:8080}/auth/google/callback
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-announcementslides}
      DB_USERNAME: ${DB_USERNAME:-announcementslides}
      DB_PASSWORD: ${DB_PASSWORD:-announcementslides}
      # First-run wizard (/setup, only while there are no users). Empty = open:
      # whoever opens the page first creates the admin, fine for a local test.
      # Set a value (and keep it secret) for anything reachable from outside.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Show the email/password login form (the wizard's admin has a password).
      # Set false once Google sign-in is configured and you want it Google-only.
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-true}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-announcementslides}
      MYSQL_USER: ${DB_USERNAME:-announcementslides}
      # The database is only reachable on the compose network. For anything
      # public, set DB_PASSWORD in .env instead of using this default.
      MYSQL_PASSWORD: ${DB_PASSWORD:-announcementslides}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  db:
