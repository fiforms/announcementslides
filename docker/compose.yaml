# AnnouncementSlides, default setup: one container, SQLite, no secrets needed.
#
#   docker compose up -d                       # works with no .env at all
#
# Configuration: copy .env.example to .env (in this directory) and set whatever
# you need. Every variable in it is passed straight into the container, so any
# Laravel setting (MAIL_*, GOOGLE_*, AWS_*, FILESYSTEM_DISK, ...) can be set
# there without editing this file.
#
# With MySQL instead of SQLite:
#   docker compose -f compose.yaml -f compose.mysql.yaml up -d
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/fiforms/announcementslides:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      GOOGLE_REDIRECT_URI: ${APP_URL:-http://localhost:8080}/auth/google/callback
    volumes:
      - storage:/var/www/html/storage

volumes:
  storage:
