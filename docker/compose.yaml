# AnnouncementSlides: app + MySQL.
#
#   cp .env.example .env     # in this docker/ directory; then edit it
#   docker compose up -d
#
# Run from this directory. To build locally instead of pulling from GHCR:
#   docker compose up -d --build
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/fiforms/announcementslides:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in docker/.env (see .env.example)}
      APP_NAME: ${APP_NAME:-Announcement Slides}
      APP_URL: ${APP_URL:-http://localhost:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-announcementslides}
      DB_USERNAME: ${DB_USERNAME:-announcementslides}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${APP_URL:-http://localhost:8080}/auth/google/callback
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-announcementslides}
      MYSQL_USER: ${DB_USERNAME:-announcementslides}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  db:
