# Always-plugged-in kiosk: Wi-Fi power saving delivers streams in bursts.
# Measured with AirShow: "connection unstable" on phones, and the Wi-Fi Direct
# link at 27 Mbit/s instead of 58.5. Also helps the SRT/RIST receiver.
# (AirShow's own udev rule covers only the Wi-Fi Direct interfaces.)
[connection]
wifi.powersave = 2
